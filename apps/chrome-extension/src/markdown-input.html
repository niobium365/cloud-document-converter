<!DOCTYPE html>
<html>
<head>
  <title>Paste Markdown Content</title>
  <style>
    :root {
      --background-primary: #ffffff;
      --text-primary: rgb(31, 31, 31);
      --border-color: #ddd;
      --button-primary: #0366d6;
      --button-hover: #0256b9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background-primary: rgb(32, 33, 36);
        --text-primary: rgb(227, 227, 227);
        --border-color: #444;
      }
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--background-primary);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 16px;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .textarea-container {
      flex: 1;
      margin-bottom: 16px;
    }

    #markdown-textarea {
      width: 100%;
      height: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      resize: none;
      font-family: monospace;
      font-size: 14px;
      background-color: var(--background-primary);
      color: var(--text-primary);
      line-height: 1.5;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    button {
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    #cancel-button {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    #submit-button {
      background-color: var(--button-primary);
      border: 1px solid transparent;
      color: white;
    }

    #submit-button:hover {
      background-color: var(--button-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Paste Markdown Content</h1>
    </div>
    <div class="textarea-container">
      <textarea id="markdown-textarea" placeholder="Paste your markdown content here..." autofocus></textarea>
    </div>
    <div class="footer">
      <button id="cancel-button">Cancel</button>
      <button id="submit-button">Insert</button>
    </div>
  </div>

  <script src="markdown-input.js"></script>
</body>
</html>
